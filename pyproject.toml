[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securerag-health"
version = "0.1.0"
description = "Secure, role-aware, multi-tenant RAG system for Hospital Management"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "authzed>=0.15.0",
    "grpcio>=1.63.0",
    "openai>=1.30.0",
    "sentence-transformers>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.0",
    "pydantic>=2.7.0",
    "redis>=5.0.4",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "W"]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
